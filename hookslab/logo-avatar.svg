<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#23352b"/>
      <stop offset="100%" stop-color="#141c17"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background for YouTube Avatar (supports both square & circular crop) -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>

  <!-- Subtle aesthetic background grid -->
  <g opacity="0.06" stroke="#c7f36b" stroke-width="1.5">
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
  </g>

  <!-- Center Group -->
  <g transform="translate(400, 360)">
    <!-- Rotated Signature Lime Brand Mark -->
    <g transform="rotate(-7)" filter="url(#shadow)">
      <rect x="-140" y="-140" width="280" height="280" rx="64" fill="#c7f36b"/>
      <text x="0" y="52" 
            font-family="'Trebuchet MS', -apple-system, BlinkMacSystemFont, Arial, sans-serif" 
            font-size="168" 
            font-weight="900" 
            fill="#17221c" 
            text-anchor="middle">↗</text>
    </g>
  </g>

  <!-- Brand Name Typography -->
  <text x="400" y="600" 
        font-family="'Trebuchet MS', -apple-system, BlinkMacSystemFont, Arial, sans-serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="-2.5" 
        fill="#f5f4ef" 
        text-anchor="middle">hooklab</text>

  <!-- Tagline -->
  <text x="400" y="645" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-style="italic" 
        font-size="22" 
        fill="#c7f36b" 
        letter-spacing="0.5" 
        text-anchor="middle">make the first seconds count</text>
</svg>